<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Осень | 2026</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* ===== СЕЗОННЫЕ ТЕМЫ ===== */
        body[data-season="all"] {
            background: linear-gradient(145deg, #1a0f0a 0%, #3a2018 35%, #6a3a20 70%, #a05a2a 100%);
            --accent: #D2691E;
            --accent-dark: #B8501A;
            --accent-deep: #8B3A1A;
            --accent-light: #E88A2A;
            --text-main: #FFF5E0;
            --text-soft: rgba(255,235,200,0.85);
            --text-dim: rgba(255,235,200,0.5);
            --card-bg: rgba(255,235,200,0.08);
            --card-border: rgba(255,210,120,0.2);
            --card-shadow: rgba(0,0,0,0.2);
            --title-grad-1: #FFF5E0;
            --title-grad-2: #FFD27A;
            --title-grad-3: #D2691E;
            --year-color: #FFD27A;
            --pill-bg: rgba(255,240,210,0.95);
            --pill-text: #7a2e0a;
            --pill-year: #B8501A;
            --badge-bg: #D2691E;
        }
        body[data-season="spring"] {
            background: linear-gradient(145deg, #3a1530 0%, #7a2e5a 35%, #c2558a 70%, #e88aa8 100%);
            --accent: #FF6B9D;
            --accent-dark: #E84A7A;
            --accent-deep: #B82E5A;
            --accent-light: #FF8FB1;
            --text-main: #FFF0F5;
            --text-soft: rgba(255,220,235,0.9);
            --text-dim: rgba(255,220,235,0.55);
            --card-bg: rgba(255,220,235,0.1);
            --card-border: rgba(255,150,190,0.28);
            --card-shadow: rgba(0,0,0,0.2);
            --title-grad-1: #FFFFFF;
            --title-grad-2: #FFC0D0;
            --title-grad-3: #FF6B9D;
            --year-color: #FFC0D0;
            --pill-bg: rgba(255,235,242,0.95);
            --pill-text: #7a1a3a;
            --pill-year: #B82E5A;
            --badge-bg: #FF6B9D;
        }
        body[data-season="summer"] {
            background: linear-gradient(145deg, #0a2a4a 0%, #1a5a8b 35%, #3a8ac2 70%, #6ac2e8 100%);
            --accent: #FFAA00;
            --accent-dark: #E88A00;
            --accent-deep: #B86A00;
            --accent-light: #FFD700;
            --text-main: #FFFFFF;
            --text-soft: rgba(220,240,255,0.92);
            --text-dim: rgba(220,240,255,0.55);
            --card-bg: rgba(200,235,255,0.1);
            --card-border: rgba(150,220,255,0.3);
            --card-shadow: rgba(0,0,0,0.2);
            --title-grad-1: #FFFFFF;
            --title-grad-2: #FFE884;
            --title-grad-3: #FFAA00;
            --year-color: #FFE884;
            --pill-bg: rgba(255,250,220,0.95);
            --pill-text: #7a4a0a;
            --pill-year: #B86A00;
            --badge-bg: #FFAA00;
        }
        body[data-season="autumn"] {
            background: linear-gradient(145deg, #4a1f0a 0%, #8b3a1a 35%, #c25e1c 70%, #e88a2a 100%);
            --accent: #E88A2A;
            --accent-dark: #D2691E;
            --accent-deep: #8B3A1A;
            --accent-light: #FFB347;
            --text-main: #FFF5E0;
            --text-soft: rgba(255,235,200,0.85);
            --text-dim: rgba(255,235,200,0.5);
            --card-bg: rgba(255,235,200,0.1);
            --card-border: rgba(255,210,120,0.22);
            --card-shadow: rgba(0,0,0,0.15);
            --title-grad-1: #FFF5E0;
            --title-grad-2: #FFD27A;
            --title-grad-3: #E88A2A;
            --year-color: #FFD27A;
            --pill-bg: rgba(255,240,210,0.95);
            --pill-text: #7a2e0a;
            --pill-year: #B8501A;
            --badge-bg: #E88A2A;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: rgba(255,245,224,0.05);
            border-radius: 44px;
            box-shadow: 0 0 0 3px rgba(255,200,120,0.28), 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            -webkit-overflow-scrolling: touch;
        }

        .phone-frame::-webkit-scrollbar { display: none; }
        .phone-frame { -ms-overflow-style: none; scrollbar-width: none; }

        .screen {
            padding: 16px;
            min-height: 100%;
            position: relative;
            z-index: 2;
            padding-bottom: 40px;
        }

        /* ===== ФОН С ЭМОДЗИ ===== */
        .inner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 44px;
        }
        .inner-bg .bg-emoji {
            position: absolute;
            opacity: 0.32;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .inner-bg .emoji-1 { bottom: 15%; right: 5%; font-size: 52px; transform: rotate(-15deg); }
        .inner-bg .emoji-2 { top: 20%; left: 3%; font-size: 48px; transform: rotate(10deg); }
        .inner-bg .emoji-3 { top: 45%; right: 2%; font-size: 45px; transform: rotate(5deg); }
        .inner-bg .emoji-4 { bottom: 30%; left: 2%; font-size: 50px; transform: rotate(-8deg); }
        .inner-bg .emoji-5 { top: 60%; right: 8%; font-size: 42px; transform: rotate(12deg); }
        .inner-bg .emoji-6 { top: 75%; left: 8%; font-size: 44px; transform: rotate(-5deg); }
        .inner-bg .emoji-7 { top: 10%; right: 12%; font-size: 40px; transform: rotate(20deg); }
        .inner-bg .emoji-8 { bottom: 50%; left: 12%; font-size: 40px; transform: rotate(-25deg); }
        .inner-bg .emoji-center-1 { top: 35%; left: 25%; font-size: 38px; transform: rotate(-10deg); opacity: 0.25; }
        .inner-bg .emoji-center-2 { top: 50%; right: 25%; font-size: 36px; transform: rotate(15deg); opacity: 0.25; }
        .inner-bg .emoji-center-3 { top: 65%; left: 35%; font-size: 34px; transform: rotate(-5deg); opacity: 0.25; }
        .inner-bg .emoji-center-4 { top: 25%; right: 35%; font-size: 35px; transform: rotate(8deg); opacity: 0.25; }

        .falling-leaf {
            position: absolute;
            font-size: 18px;
            opacity: 0.4;
            animation: fallLeaf 12s linear infinite;
            pointer-events: none;
        }
        @keyframes fallLeaf {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(900px) rotate(360deg); opacity: 0; }
        }

        /* ===== ШАПКА ===== */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            margin-bottom: 20px;
            padding-top: 4px;
        }
        .header-bar {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 14px var(--card-shadow);
            transition: background 0.4s, border 0.4s;
        }

        .dropdown-stages {
            position: relative;
            z-index: 200;
            flex: 1;
            min-width: 0;
        }
        .dropdown-btn {
            width: 100%;
            background: var(--pill-bg);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 13px;
            padding: 6px 10px 6px 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--pill-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .dropdown-btn:hover {
            transform: translateY(-1px);
        }
        .season-icon-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .season-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1;
            flex: 1;
            min-width: 0;
        }
        .season-name {
            font-size: 13px;
            font-weight: 800;
            color: var(--pill-text);
            letter-spacing: 0.2px;
        }
        .season-year {
            font-size: 9px;
            font-weight: 600;
            color: var(--pill-year);
            margin-top: 2px;
            letter-spacing: 0.4px;
        }
        .dropdown-btn .arrow {
            font-size: 9px;
            color: var(--pill-year);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .dropdown-stages.open .dropdown-btn .arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255,245,225,0.98);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1px solid rgba(194,94,28,0.35);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.98);
            transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 300;
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
        }
        .dropdown-stages.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .stage-item {
            padding: 11px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.15s;
            border-bottom: 1px solid rgba(194,94,28,0.08);
        }
        .stage-item:last-child { border-bottom: none; }
        .stage-item:hover:not(.disabled) {
            background: rgba(232,138,42,0.1);
        }
        .stage-item.active {
            background: linear-gradient(90deg, rgba(232,138,42,0.2), rgba(232,138,42,0.03));
            border-left: 3px solid var(--accent);
        }
        .stage-item .stage-name-drop {
            font-weight: 700;
            color: #4a1f0a;
            font-size: 13px;
        }
        .stage-item.active .stage-name-drop {
            color: #B8501A;
            font-weight: 800;
        }
        .stage-item .stage-date-drop {
            font-size: 10px;
            color: #c25e1c;
            font-weight: 700;
            background: rgba(232,138,42,0.15);
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 22px;
            text-align: center;
        }
        .stage-item.active .stage-date-drop {
            background: var(--accent);
            color: #fff;
        }

        /* ===== НЕДОСТУПНЫЙ СЕЗОН (ЗИМА) ===== */
        .stage-item.disabled {
            cursor: not-allowed;
            opacity: 0.45;
            position: relative;
            pointer-events: none;
        }
        .stage-item.disabled .stage-name-drop {
            color: #8a8a8a;
        }
        .stage-item.disabled .stage-date-drop {
            background: rgba(150,150,150,0.2);
            color: #8a8a8a;
            font-size: 9px;
            letter-spacing: 0.3px;
        }

        /* ===== ЛОГО В КВАДРАТИКЕ ===== */
        .logo-badge {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-dark) 100%);
            border: 1px solid rgba(255,220,150,0.25);
            border-radius: 13px;
            width: 42px;
            height: 42px;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            user-select: none;
            box-shadow: 
                0 3px 8px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,220,150,0.3);
            transition: background 0.3s;
            letter-spacing: -0.5px;
            font-family: 'Inter', sans-serif;
        }

        /* ===== HERO ЗАГОЛОВОК ===== */
        .hero-title {
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 5;
            transform: rotate(-2deg);
        }
        .hero-title h1 {
            font-size: 54px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--title-grad-1), var(--title-grad-2), var(--title-grad-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
            transform: skewX(-3deg);
            text-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: filter 0.4s;
        }
        .year-box {
            display: inline-block;
            margin-top: 5px;
            padding: 5px 20px;
            border: 2px solid var(--accent);
            border-radius: 40px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: rgba(20,8,2,0.45);
            transform: rotate(1deg);
            letter-spacing: 1px;
            transition: border-color 0.4s;
        }

        /* ===== ПРИВЕТСТВЕННАЯ ПЛАШКА ===== */
        .welcome-banner {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 14px 18px;
            margin: 0 0 18px;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: background 0.4s, border 0.4s;
        }
        .welcome-banner .main-text {
            font-size: 15px;
            font-weight: 800;
            color: var(--year-color);
            letter-spacing: 0.4px;
            transition: color 0.4s;
        }
        .welcome-banner .sub-text {
            font-size: 12px;
            color: var(--text-soft);
            margin-top: 5px;
            line-height: 1.5;
            transition: color 0.4s;
        }

        /* ===== СЧЁТЧИК ===== */
        .counter {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            margin: 0 auto 14px;
            padding: 5px 16px;
            border-radius: 50px;
            color: var(--year-color);
            background: rgba(20,8,2,0.4);
            border: 1px solid var(--card-border);
            width: fit-content;
            backdrop-filter: blur(4px);
            transition: color 0.4s, border-color 0.4s;
        }

        /* ===== СПИСОК СОБЫТИЙ ===== */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 5;
        }
        .event-item-link {
            display: block;
            text-decoration: none;
            color: inherit;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .event-item-link.show {
            opacity: 1;
            transform: translateY(0);
        }
        .event-item-link:active .event-item {
            transform: scale(0.97);
            transition: 0.1s;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 16px;
            border-radius: 18px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 14px var(--card-shadow);
            transition: 0.2s, background 0.4s, border 0.4s;
            border-left: 4px solid var(--accent);
        }

        .event-icon {
            font-size: 26px;
            margin-right: 12px;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }
        .event-info {
            flex: 1;
            min-width: 0;
        }
        .event-info h2 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.3px;
            transition: color 0.4s;
        }
        .event-info .meta {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-soft);
            margin-top: 3px;
            transition: color 0.4s;
        }
        .event-info .meta span {
            font-weight: 300;
            opacity: 0.5;
            margin: 0 3px;
        }

        .event-badge {
            border-radius: 50px;
            padding: 4px 11px;
            font-size: 9px;
            font-weight: 800;
            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
            letter-spacing: 0.4px;
        }
        .event-badge.past {
            background: rgba(255,235,200,0.12);
            color: var(--text-dim);
            border: 1px solid var(--card-border);
        }
        .event-badge.soon {
            background: var(--badge-bg);
            color: #fff;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }
        .event-badge.process {
            background: var(--accent-dark);
            color: #fff;
            animation: pulseBadge 1.8s ease-in-out infinite;
        }
        @keyframes pulseBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-dim);
            font-size: 13px;
        }
        .empty-state .empty-icon {
            font-size: 44px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .empty-state .empty-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-soft);
            margin-bottom: 4px;
        }

        /* ===== ПОДВАЛ ===== */
        .footer-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 30px;
            letter-spacing: 1px;
            transition: color 0.4s;
        }

        @media (max-width: 380px) {
            .hero-title h1 { font-size: 44px; }
            .event-info h2 { font-size: 15px; }
            .event-item { padding: 12px 14px; }
            .event-icon { font-size: 22px; margin-right: 10px; }
            .season-name { font-size: 12px; }
        }
    </style>
</head>
<body data-season="all">

<div class="phone-frame" id="phoneFrame">
    <!-- Фон с эмодзи -->
    <div class="inner-bg">
        <div class="bg-emoji emoji-1"></div>
        <div class="bg-emoji emoji-2"></div>
        <div class="bg-emoji emoji-3"></div>
        <div class="bg-emoji emoji-4"></div>
        <div class="bg-emoji emoji-5"></div>
        <div class="bg-emoji emoji-6"></div>
        <div class="bg-emoji emoji-7"></div>
        <div class="bg-emoji emoji-8"></div>
        <div class="bg-emoji emoji-center-1"></div>
        <div class="bg-emoji emoji-center-2"></div>
        <div class="bg-emoji emoji-center-3"></div>
        <div class="bg-emoji emoji-center-4"></div>

        <div class="falling-leaf" style="left:10%; animation-delay:0s;"></div>
        <div class="falling-leaf" style="left:30%; animation-delay:3s;"></div>
        <div class="falling-leaf" style="left:55%; animation-delay:6s;"></div>
        <div class="falling-leaf" style="left:75%; animation-delay:1.5s;"></div>
        <div class="falling-leaf" style="left:90%; animation-delay:4.5s;"></div>
    </div>

    <div class="screen">
        <!-- ШАПКА -->
        <div class="sticky-header">
            <div class="header-bar">
                <div class="dropdown-stages" id="dropdownStages">
                    <div class="dropdown-btn" id="dropdownBtn">
                        <span class="season-icon-badge" id="seasonIcon">✨</span>
                        <span class="season-text">
                            <span class="season-name" id="seasonName">Все события</span>
                            <span class="season-year" id="seasonYear">2026 · 7 записей</span>
                        </span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="stage-item active" data-season="all"><span class="stage-name-drop">✨ Все события</span><span class="stage-date-drop" data-count>7</span></div>
                        <div class="stage-item" data-season="spring"><span class="stage-name-drop">🌸 Весна</span><span class="stage-date-drop" data-count>0</span></div>
                        <div class="stage-item" data-season="summer"><span class="stage-name-drop">☀️ Лето</span><span class="stage-date-drop" data-count>0</span></div>
                        <div class="stage-item" data-season="autumn"><span class="stage-name-drop">🍁 Осень</span><span class="stage-date-drop" data-count>0</span></div>
                        <div class="stage-item disabled" data-season="winter" aria-disabled="true"><span class="stage-name-drop">❄️ Зима</span><span class="stage-date-drop">🔒</span></div>
                    </div>
                </div>
                <!-- Лого в квадратике -->
                <div class="logo-badge" aria-label="Логотип">К</div>
            </div>
        </div>

        <!-- HERO ЗАГОЛОВОК -->
        <div class="hero-title">
            <h1 id="heroTitle">Дневник</h1>
            <div class="year-box" id="yearBox">✨ 2026</div>
        </div>

        <!-- ПРИВЕТСТВЕННАЯ ПЛАШКА -->
        <div class="welcome-banner">
            <div class="main-text" id="welcomeTitle">✨ Все события 2026</div>
            <div class="sub-text" id="welcomeSub">Все самые яркие моменты года в одном месте</div>
        </div>

        <!-- СЧЁТЧИК -->
        <div class="counter" id="counter">✨ 7 событий</div>

        <!-- СПИСОК СОБЫТИЙ -->
        <div class="events-list" id="eventList"></div>

        <div class="footer-note" id="footerNote">🍁 Дневник · 2026 🍂</div>
    </div>
</div>

<script>
    // ---------- ВСЕ СОБЫТИЯ ----------
    const allEvents = [
        { id: 'to-moscow-2026', title: 'To Moscow', date: '18.07.2026', type: 'Поездка', rawDate: '2026-07-18', icon: '🏙️', season: 'summer' },
        { id: 'vk-fest-2026', title: 'ВК ФЕСТ 2026', date: '19.07.2026', type: 'Фестиваль', rawDate: '2026-07-19', icon: '🎤', season: 'summer' },
        { id: 'molodezhnyy-den', title: 'Молодежный день', date: '27.06.2026', type: 'Фестиваль', rawDate: '2026-06-27', icon: '🎉', season: 'summer' },
        { id: 'concert-zveri', title: 'Концерт Звери', date: '16.05.2026', type: 'Концерт', rawDate: '2026-05-16', icon: '🎸', season: 'spring' },
        { id: 'to-moscow-2', title: 'To Moscow #2', date: '26.04.2026', type: 'Поездка', rawDate: '2026-04-26', icon: '🏙️', season: 'spring' },
        { id: 'rozgrysh-8-marta', title: 'Розыгрыш 8 марта', date: '08.03.2026', type: '8 марта', rawDate: '2026-03-08', icon: '🌸', season: 'spring' },
        { id: 'rozgrysh-dr', title: 'Розыгрыш ДР', date: '28.02.2026', type: 'День рождения', rawDate: '2026-02-28', icon: '🎂', season: 'spring' }
    ];

    // ---------- НЕДОСТУПНЫЕ СЕЗОНЫ ----------
    const disabledSeasons = ['winter'];

    // ---------- МЕТАДАННЫЕ СЕЗОНОВ ----------
    const seasonMeta = {
        all: {
            icon: '✨',
            name: 'Все события',
            hero: 'Дневник',
            yearEmoji: '✨',
            welcomeTitle: '✨ Все события 2026',
            welcomeSub: 'Все самые яркие моменты года в одном месте'
        },
        spring: {
            icon: '🌸',
            name: 'Весна',
            hero: 'Весна',
            yearEmoji: '🌸',
            welcomeTitle: '🌸 Весна — время пробуждения',
            welcomeSub: 'Первые цветы, тёплый воздух и новые истории'
        },
        summer: {
            icon: '☀️',
            name: 'Лето',
            hero: 'Лето',
            yearEmoji: '☀️',
            welcomeTitle: '☀️ Лето — время приключений',
            welcomeSub: 'Солнце, пляж и незабываемые моменты'
        },
        autumn: {
            icon: '🍁',
            name: 'Осень',
            hero: 'Осень',
            yearEmoji: '🍁',
            welcomeTitle: '🍁 Осень — время тёплых историй',
            welcomeSub: 'Уютные вечера с чаем, прогулки в золоте листвы'
        }
    };

    // ---------- ЭМОДЗИ ДЛЯ ФОНА ----------
    const bgEmojiSets = {
        all:    ['🍁','🍂','🌰','🍄','🎃','☕','🌧️','🍁','🍂','🌰','🍁','🕯️'],
        spring: ['🌸','🌷','🌿','🌱','🦋','🐣','🌼','🍀','🌺','🌻','💐','🪴'],
        summer: ['☀️','🌊','🍉','🏖️','🌴','🍦','🐚','🌺','🥥','🩴','🌞','🐬'],
        autumn: ['🍁','🍂','🌰','🍄','🎃','☕','🌧️','🍁','🍂','🌰','🍁','🕯️']
    };

    const fallingEmojiSets = {
        all:    ['🍁','🍂','🍁','🍂','🍁'],
        spring: ['🌸','🌸','🌸','🌸','🌸'],
        summer: ['✨','🌸','✨','🌸','✨'],
        autumn: ['🍁','🍂','🍁','🍂','🍁']
    };

    // ---------- УТИЛИТЫ ----------
    function sortEvents(events) {
        return [...events].sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));
    }

    function getMoscowDate() {
        const now = new Date();
        const moscowOffset = 3 * 60;
        const localOffset = now.getTimezoneOffset();
        return new Date(now.getTime() + (moscowOffset + localOffset) * 60000);
    }

    function getEventStatus(rawDate) {
        const now = getMoscowDate();
        now.setHours(0, 0, 0, 0);
        const parts = rawDate.split('-');
        const eventDate = new Date(Date.UTC(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])));
        eventDate.setHours(0, 0, 0, 0);
        if (eventDate.getTime() === now.getTime()) return 'process';
        if (eventDate > now) return 'soon';
        return 'past';
    }

    function plural(n, one, few, many) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return one;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
        return many;
    }

    // ---------- DOM ----------
    const listEl = document.getElementById('eventList');
    const counterEl = document.getElementById('counter');
    const seasonIcon = document.getElementById('seasonIcon');
    const seasonName = document.getElementById('seasonName');
    const seasonYear = document.getElementById('seasonYear');
    const heroTitle = document.getElementById('heroTitle');
    const yearBox = document.getElementById('yearBox');
    const welcomeTitle = document.getElementById('welcomeTitle');
    const welcomeSub = document.getElementById('welcomeSub');
    const footerNote = document.getElementById('footerNote');

    let currentSeason = 'all';

    // ---------- ОБНОВЛЕНИЕ ФОНА ----------
    function updateBackground(season) {
        const bgEmojis = document.querySelectorAll('.bg-emoji');
        const set = bgEmojiSets[season] || bgEmojiSets.all;
        bgEmojis.forEach((el, i) => {
            el.textContent = set[i] || '';
        });

        const falling = document.querySelectorAll('.falling-leaf');
        const fset = fallingEmojiSets[season] || fallingEmojiSets.all;
        falling.forEach((el, i) => {
            el.textContent = fset[i] || '✨';
        });
    }

    // ---------- ОБНОВЛЕНИЕ ТЕМЫ ----------
    function updateTheme(season) {
        const meta = seasonMeta[season];
        document.body.setAttribute('data-season', season);

        heroTitle.textContent = meta.hero;
        yearBox.textContent = `${meta.yearEmoji} 2026`;

        welcomeTitle.textContent = meta.welcomeTitle;
        welcomeSub.textContent = meta.welcomeSub;

        seasonIcon.textContent = meta.icon;
        seasonName.textContent = meta.name;

        updateBackground(season);
    }

    // ---------- РЕНДЕР СОБЫТИЙ ----------
    function renderEvents() {
        let filtered = currentSeason === 'all'
            ? allEvents
            : allEvents.filter(e => e.season === currentSeason);

        const sorted = sortEvents(filtered);
        listEl.innerHTML = '';

        counterEl.textContent = `${seasonMeta[currentSeason].icon} ${sorted.length} ${plural(sorted.length, 'событие', 'события', 'событий')}`;
        seasonYear.textContent = `2026 · ${sorted.length} ${plural(sorted.length, 'запись', 'записи', 'записей')}`;

        if (sorted.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.innerHTML = `
                <span class="empty-icon">${seasonMeta[currentSeason].icon}</span>
                <div class="empty-title">Пока нет событий</div>
                <div>Здесь появятся записи этого сезона</div>
            `;
            listEl.appendChild(empty);
            return;
        }

        sorted.forEach((ev, index) => {
            const status = getEventStatus(ev.rawDate);
            let badgeText = 'ПРОШЛО';
            let badgeClass = 'past';
            if (status === 'soon') { badgeText = 'СКОРО'; badgeClass = 'soon'; }
            else if (status === 'process') { badgeText = 'СЕГОДНЯ'; badgeClass = 'process'; }

            const link = document.createElement('a');
            link.href = ev.id + '.html';
            link.className = 'event-item-link';

            const item = document.createElement('div');
            item.className = 'event-item';

            item.innerHTML = `
                <div class="event-icon">${ev.icon}</div>
                <div class="event-info">
                    <h2>${ev.title}</h2>
                    <div class="meta">${ev.type} <span>|</span> ${ev.date}</div>
                </div>
                <div class="event-badge ${badgeClass}">${badgeText}</div>
            `;

            link.appendChild(item);
            listEl.appendChild(link);

            setTimeout(() => link.classList.add('show'), index * 60);
        });
    }

    // ---------- СЧЁТЧИКИ В ДРОПДАУНЕ ----------
    function updateDropdownCounts() {
        document.querySelectorAll('.stage-item').forEach(item => {
            const season = item.dataset.season;
            if (disabledSeasons.includes(season)) return; // Пропускаем недоступные
            const count = season === 'all'
                ? allEvents.length
                : allEvents.filter(e => e.season === season).length;
            const countEl = item.querySelector('[data-count]');
            if (countEl) countEl.textContent = count;
        });
    }

    // ---------- СМЕНА СЕЗОНА ----------
    function switchSeason(season) {
        if (disabledSeasons.includes(season)) return; // Защита от перехода
        currentSeason = season;
        updateTheme(season);
        renderEvents();
    }

    // ---------- ДРОПДАУН ----------
    const dropdown = document.getElementById('dropdownStages');
    const dropdownBtn = document.getElementById('dropdownBtn');

    dropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
        if (dropdown && !dropdown.contains(e.target)) dropdown.classList.remove('open');
    });

    document.querySelectorAll('.stage-item').forEach(item => {
        item.addEventListener('click', () => {
            const season = item.dataset.season;

            // Не даём кликать на недоступные сезоны
            if (disabledSeasons.includes(season)) return;

            document.querySelectorAll('.stage-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            dropdown.classList.remove('open');
            switchSeason(season);
        });
    });

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    updateDropdownCounts();
    updateTheme('all');
    renderEvents();
</script>
